name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash:
    name: Bash (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Lint
        run: shellcheck -S warning bash/*.sh
      - name: Test
        run: bats tests/bash

  powershell:
    name: PowerShell (PSScriptAnalyzer + Pester)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install modules
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        run: |
          $issues = Invoke-ScriptAnalyzer -Path powershell -Recurse
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }
      - name: Test
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path tests/powershell -CI -Output Detailed
